name: CI

# Runs on every push to any branch, so changes are checked before merging into main
on:
  push:
  pull_request:

# Read-only: this workflow doesn't need to write anything to the repo
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Format (Prettier)
        run: npm run format:check

      - name: Types (astro check)
        run: npm run check

      - name: Build
        run: npm run build
